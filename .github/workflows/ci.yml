# Checks that a fresh clone installs, builds and runs on Windows, macOS and Linux,
# and that the whole Oracle setup (schema, Database Lab, Smart Warehouse) installs and passes db:selftest.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Build and run (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 18 }
          - { os: ubuntu-latest, node: 22 }
          - { os: windows-latest, node: 20 }
          - { os: macos-latest, node: 20 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test without Oracle
        run: npm run smoke

  oracle:
    name: Oracle 23ai setup and self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start Oracle (npm run db:up)
        run: npm run db:up
      - name: Create the schema (npm run db:setup)
        run: npm run db:setup 2>&1 | tee setup.log
        shell: bash -o pipefail -e {0}
      - name: Self-test (npm run db:selftest)
        run: npm run db:selftest 2>&1 | tee selftest.log
        shell: bash -o pipefail -e {0}
      - name: Smoke test with Oracle
        run: npm run smoke 2>&1 | tee smoke.log
        shell: bash -o pipefail -e {0}
        env:
          DB_MODE: oracle
      - name: Report the failure as annotations
        if: failure()
        shell: bash
        run: |
          docker logs --tail 60 waretrack-oracle > oracle.log 2>&1 || true
          for f in setup.log selftest.log smoke.log oracle.log; do
            [ -s "$f" ] || continue
            msg=$(tail -n 70 "$f" | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done
